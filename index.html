<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Matematično igrišče</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Podvodni svet: hobotnica Hobi vodi otroka skozi igro, nagrade so biseri.
   Telefon: en stolpec. Široka ali ležeča tablica: vprašanje levo, številčnica desno.
   Vsak modul se nariše v isti okvir (#app), začetni zaslon pa jih našteje iz seznama MODULES. */
:root{
  --bg:#E4F5F8; --surface:#FFFFFF; --surface-2:#C9E9EF; --edge:#AFD6DE;
  --fg:#0E2E47; --muted:#3B5C75;
  --accent:#0B6E8A; --accent-fg:#FFFFFF; --accent-deep:#074A5E; --accent-soft:#CFF0F6; --accent-soft-fg:#074A5E;
  --action:#C93B2B; --action-fg:#FFFFFF; --action-deep:#8F2A1E;
  --mascot:#F0705A; --mascot-deep:#D8523C; --ink:#1B2540; --blush:#FF9EB0;
  --pearl:#F7DDEC; --pearl-edge:#9A5B86; --s1:#E9A400; --s2:#7B5EA7;
  --try-bg:#FFE9C7; --try-fg:#6B3F00;
  --focus:#1D4ED8;
  --bubble:rgba(11,110,138,.09);
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1E33; --surface:#12304B; --surface-2:#1A3F5F; --edge:#061423;
    --fg:#E6F5FA; --muted:#A8C8D9;
    --accent:#4CC9E0; --accent-fg:#03303B; --accent-deep:#1D8CA6; --accent-soft:#124A5C; --accent-soft-fg:#C8F2FB;
    --action:#FF8A73; --action-fg:#3A0E06; --action-deep:#A9442F;
    --mascot:#FF8F78; --mascot-deep:#E86F57; --blush:#FFB0C0;
    --pearl:#FBE9F4; --pearl-edge:#D79CC3; --s1:#FFC83D; --s2:#B59CE0;
    --try-bg:#4A3510; --try-fg:#FFE2AE;
    --focus:#FFD166;
    --bubble:rgba(130,225,245,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1E33; --surface:#12304B; --surface-2:#1A3F5F; --edge:#061423;
  --fg:#E6F5FA; --muted:#A8C8D9;
  --accent:#4CC9E0; --accent-fg:#03303B; --accent-deep:#1D8CA6; --accent-soft:#124A5C; --accent-soft-fg:#C8F2FB;
  --action:#FF8A73; --action-fg:#3A0E06; --action-deep:#A9442F;
  --mascot:#FF8F78; --mascot-deep:#E86F57; --blush:#FFB0C0;
  --pearl:#FBE9F4; --pearl-edge:#D79CC3; --s1:#FFC83D; --s2:#B59CE0;
  --try-bg:#4A3510; --try-fg:#FFE2AE;
  --focus:#FFD166;
  --bubble:rgba(130,225,245,.08);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--fg);
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 8% 22%,var(--bubble) 0 18px,transparent 19px),
    radial-gradient(circle at 93% 12%,var(--bubble) 0 28px,transparent 29px),
    radial-gradient(circle at 86% 70%,var(--bubble) 0 14px,transparent 15px),
    radial-gradient(circle at 14% 84%,var(--bubble) 0 24px,transparent 25px);
  background-repeat:no-repeat;
  font-family:var(--font); font-size:18px; line-height:1.35;
  padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
#app{min-height:100%; display:flex; flex-direction:column; gap:18px; max-width:1120px; margin:0 auto}
h1,h2,p{margin:0}
h1{font-size:clamp(1.9rem,6vw,2.8rem); font-weight:600; line-height:1.1; text-wrap:balance}
h2{font-size:1.25rem; font-weight:600}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--focus); outline-offset:3px}

/* Biser in hobotnica */
.pb{fill:var(--pearl); stroke:var(--pearl-edge); stroke-width:1.5}
.ps{fill:#fff; opacity:.9}
.mascot .ob{fill:var(--mascot)}
.mascot .ot{fill:none; stroke:var(--mascot); stroke-width:11; stroke-linecap:round}
.mascot .od{fill:var(--mascot-deep)}
.mascot .oe,.mascot .oh{fill:#fff}
.mascot .op{fill:var(--ink)}
.mascot .oc{fill:var(--blush); opacity:.6}
.mascot .oa{fill:none; stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round}
.mascot .om{fill:var(--ink); stroke:var(--ink); stroke-width:2; stroke-linejoin:round}

/* Skupni deli */
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.hello{color:var(--muted); font-size:1.05rem}
.tools{display:flex; gap:10px; flex:none}
.icon-btn{width:52px; height:52px; padding:0; border:0; border-radius:16px; background:var(--surface); box-shadow:0 3px 0 var(--edge); display:grid; place-items:center; flex:none}
.icon-btn svg{width:26px; height:26px; fill:none; stroke:var(--fg); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
.btn{min-height:52px; padding:0 24px; border:0; border-radius:16px; background:var(--accent); color:var(--accent-fg); font-weight:600; font-size:1.1rem; box-shadow:0 3px 0 var(--accent-deep)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface-2); color:var(--fg); box-shadow:0 3px 0 var(--edge)}
.pagehead{display:flex; align-items:center; gap:14px}
.pagehead h1{font-size:clamp(1.5rem,5vw,2.2rem)}
.sub{color:var(--muted)}

/* Začetni zaslon */
.nameform{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); border-radius:20px; padding:14px 16px; box-shadow:0 3px 0 var(--edge)}
.nameform label{font-weight:500}
.nameform input{flex:1 1 160px; min-width:0; height:52px; border-radius:14px; border:2px solid var(--muted); background:var(--bg); color:var(--fg); font:inherit; font-size:1.2rem; padding:0 14px}
.buddy{display:flex; align-items:center; gap:16px}
.buddy .mascot{width:104px; height:104px; flex:none}
.bubble{position:relative; flex:1; min-width:0; background:var(--surface); border-radius:22px; padding:14px 18px; box-shadow:0 3px 0 var(--edge); font-size:1.15rem; font-weight:500}
.bubble::before{content:""; position:absolute; left:-10px; top:50%; margin-top:-9px; border-style:solid; border-width:9px 10px 9px 0; border-color:transparent var(--surface) transparent transparent}
.stats{display:flex; flex-wrap:wrap; gap:12px}
.stat{flex:1 1 200px; min-width:0; display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:20px; padding:14px 20px; box-shadow:0 3px 0 var(--edge)}
.stat .ic{display:grid; flex:none}
.stat .ic svg{width:34px; height:34px}
.stat b{display:block; font-size:1.6rem; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .lbl{color:var(--muted); font-size:.95rem}
.cal{fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.modules{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.module{display:flex; align-items:center; gap:16px; width:100%; text-align:left; padding:18px 20px; border:0; border-radius:24px; background:var(--accent); color:var(--accent-fg); box-shadow:0 4px 0 var(--accent-deep)}
.module:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep)}
.module:disabled{background:var(--surface-2); color:var(--muted); box-shadow:none}
.module .ico{width:56px; height:56px; border-radius:16px; background:var(--surface); display:grid; place-items:center; flex:none}
.module .ico svg{width:56px; height:56px}
.ico path,.ico circle{fill:none; stroke-width:4.5; stroke-linecap:round}
.ico .a{stroke:var(--accent)}
.ico .b{stroke:var(--action)}
.module:disabled .ico .a,.module:disabled .ico .b{stroke:var(--muted)}
.module .t{display:block; font-size:1.4rem; font-weight:600; line-height:1.15}
.module .d{display:block; font-size:1rem}

/* Izbira težavnosti */
.levels{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.level{display:flex; flex-direction:column; align-items:flex-start; gap:6px; width:100%; text-align:left; padding:20px; border:0; border-radius:24px; background:var(--surface); box-shadow:0 4px 0 var(--edge)}
.level:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge)}
.level .name{font-size:1.7rem; font-weight:600}
.level .desc{color:var(--muted)}
.level .ex{margin-top:6px; background:var(--accent-soft); color:var(--accent-soft-fg); border-radius:12px; padding:6px 14px; font-size:1.4rem; font-weight:600; font-variant-numeric:tabular-nums}
.level .best{font-size:.95rem; color:var(--muted)}
.tables{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tbl{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:92px; padding:10px 6px; border:0; border-radius:20px; background:var(--surface); box-shadow:0 4px 0 var(--edge); font-size:2rem; font-weight:600; line-height:1}
.tbl small{font-size:.85rem; font-weight:500; color:var(--muted)}
.tbl:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge)}

/* Branje ure */
.clockcard{gap:0; padding:clamp(12px,3vh,28px) 16px}
.bigclock{width:min(100%,clamp(220px,38vh,340px)); aspect-ratio:1}
.bigclock svg,.opt svg{display:block; width:100%; height:100%}
.digital{font-size:clamp(3.5rem,16vw,7rem); font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; padding:clamp(6px,2vh,20px) 0}
.cface{fill:var(--surface); stroke:var(--fg); stroke-width:5}
.ctick{stroke:var(--muted); stroke-width:1.5}
.ctick5{stroke:var(--fg); stroke-width:3}
.cnum{fill:var(--fg); font-family:var(--font); font-weight:600}
.chour{stroke:var(--fg); stroke-width:9; stroke-linecap:round}
.cmin{stroke:var(--accent); stroke-width:6; stroke-linecap:round}
.ccap{fill:var(--action)}
.opts{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:480px; margin:auto auto 0}
.opts.sets{max-width:420px}
.opt{min-height:clamp(72px,12vh,120px); padding:8px; border:0; border-radius:22px; background:var(--surface); box-shadow:0 4px 0 var(--edge); font-size:clamp(1.8rem,6vw,2.6rem); font-weight:600; font-variant-numeric:tabular-nums; display:grid; place-items:center}
.opt.clockopt{min-height:0; aspect-ratio:1; padding:6px}
.opt:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge)}
.opt[data-state="wrong"]{background:var(--try-bg); color:var(--try-fg)}
.opt[data-state="right"]{background:var(--accent-soft); color:var(--accent-soft-fg); outline:4px solid var(--accent); outline-offset:-4px}
.opts .next{grid-column:1/-1}

/* Zaporedja */
.expr.seq{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:100%; white-space:normal; letter-spacing:0; font-size:clamp(1.5rem,6.5vw,2.6rem); line-height:1.1}
.tile{min-width:1.9em; padding:8px 10px; border-radius:14px; background:var(--accent-soft); color:var(--accent-soft-fg); text-align:center; font-variant-numeric:tabular-nums}
.tile.gap{background:transparent; border:3px dashed var(--accent); color:var(--accent); padding:5px 7px}
.fshape{stroke:var(--fg); stroke-width:2; stroke-linejoin:round}
.fs0{fill:var(--accent)}
.fs1{fill:var(--action)}
.fs2{fill:var(--s1)}
.fs3{fill:var(--s2)}
.shapes{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:clamp(8px,3vh,28px) 0}
.shp{width:clamp(34px,10vw,56px); aspect-ratio:1; display:grid; place-items:center}
.shp svg{display:block; width:100%; height:100%}
.shp.gap{border:3px dashed var(--accent); border-radius:14px; color:var(--accent); font-weight:600; font-size:1.6rem}
.opt.shapeopt svg{width:auto; height:clamp(44px,8vh,64px)}
.level .ex.shapesex{display:flex; align-items:center; gap:4px}
.shapesex svg{width:24px; height:24px}
.shapesex .qm{font-weight:600; padding-left:4px}

/* Igra */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px}
.count{font-weight:600; font-size:1.1rem; text-align:center}
.earned{display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:52px; font-weight:600; font-size:1.25rem}
.earned .ei{display:grid}
.earned svg{width:30px; height:30px}
.progress{height:14px; border-radius:7px; background:var(--surface-2); overflow:hidden}
.progress>i{display:block; height:100%; border-radius:7px; background:var(--accent); transition:width .3s}
.play{display:flex; flex-direction:column; gap:16px; flex:1}
.stage{display:flex; flex-direction:column; gap:14px}
.qcard{display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--surface); border-radius:28px; box-shadow:0 5px 0 var(--edge); padding:clamp(18px,4vh,40px) 20px}
.expr{font-size:clamp(3rem,13vw,6rem); font-weight:600; letter-spacing:.04em; line-height:1.05; font-variant-numeric:tabular-nums; white-space:nowrap}
.ans{min-width:2.6em; text-align:center; border-bottom:5px solid var(--accent); color:var(--accent); font-size:clamp(2.8rem,11vw,5rem); font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.ans.empty{color:var(--muted)}
.fb{min-height:68px; display:flex; align-items:center; gap:12px; border-radius:20px; padding:8px 16px 8px 10px; font-size:1.2rem; font-weight:600; background:var(--surface-2); color:var(--muted)}
.fb .mi{display:grid; flex:none}
.fb .mascot{width:54px; height:54px}
.fb .ft{flex:1; min-width:0}
.fb[data-state="ok"]{background:var(--accent-soft); color:var(--accent-soft-fg)}
.fb[data-state="retry"],.fb[data-state="wrong"]{background:var(--try-bg); color:var(--try-fg)}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:480px; margin:auto auto 0}
.key{height:clamp(56px,8.5vh,96px); padding:0; border:0; border-radius:20px; background:var(--surface); box-shadow:0 4px 0 var(--edge); font-size:clamp(1.8rem,5vh,2.6rem); font-weight:600; display:grid; place-items:center}
.key:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge)}
.key svg{width:34px; height:34px; fill:none; stroke:var(--fg); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.key.go{background:var(--action); color:var(--action-fg); box-shadow:0 4px 0 var(--action-deep); font-size:clamp(1.1rem,3.2vh,1.5rem)}
.key.go:active{box-shadow:0 1px 0 var(--action-deep)}
@media (min-width:820px){
  .play{display:grid; grid-template-columns:1fr minmax(340px,460px); gap:40px; align-items:center}
  .pad,.opts{margin:0}
  .key{height:clamp(72px,11vh,100px)}
}

/* Nove igre: besedila, kovanci, ulomki, liki, spomin, tabela */
.expr.word{font-size:clamp(1.3rem,4.6vw,2.1rem); white-space:normal; letter-spacing:0; line-height:1.3; text-align:center; font-weight:500; text-wrap:balance}
.expr.eq{font-size:clamp(2.2rem,9vw,4.4rem); white-space:normal; letter-spacing:.02em; text-align:center}
.expr.seq.sm{font-size:clamp(1.1rem,4.6vw,1.9rem)}
.coins{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; padding:4px 0}
.coins[hidden]{display:none}
.coin{display:grid; place-items:center; width:clamp(48px,12vw,68px); aspect-ratio:1; border-radius:50%; border:3px solid #5A4A1E; font-weight:600; font-size:clamp(.8rem,2.6vw,1rem); color:#2A1D05; background:#E9C14A}
.coin.c0{background:#D58A5B; border-color:#7A4524}
.coin.c2{background:#EAD9A0; border-color:#8A8A8A; box-shadow:inset 0 0 0 5px #D9B33F}
.coin.note{border-radius:8px; aspect-ratio:2/1; width:clamp(76px,19vw,106px); border-color:#3C4A52; font-size:clamp(1rem,3.4vw,1.4rem)}
.coin.n500{background:#B9C3C6}
.coin.n1000{background:#E9A9A3}
.coin.n2000{background:#8FB7E8}
.coin.n5000{background:#F0B27A}
.cmp{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:14px; font-size:clamp(1.8rem,8.5vw,3.8rem); font-weight:600; font-variant-numeric:tabular-nums; padding:clamp(6px,2vh,18px) 0}
.cmp .qm{min-width:1.3em; text-align:center; border:3px dashed var(--accent); border-radius:14px; color:var(--accent); padding:0 6px}
.opt.txt{font-size:clamp(1.1rem,4.4vw,1.7rem)}
.frac{display:inline-flex; flex-direction:column; align-items:center; line-height:1.05}
.frac i{font-style:normal; padding:0 10px}
.frac i+i{border-top:4px solid currentColor}
.pie{width:min(70%,clamp(150px,30vh,240px)); aspect-ratio:1}
.pie svg,.bigshape svg{display:block; width:100%; height:100%}
.pslice{fill:var(--surface-2); stroke:var(--fg); stroke-width:3; stroke-linejoin:round}
.pslice.on{fill:var(--action)}
.bigshape{width:min(70%,clamp(130px,26vh,220px)); aspect-ratio:1}
.poly{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round}
.mem{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; max-width:680px; margin:0 auto}
.mcard{aspect-ratio:1/1.05; min-width:0; padding:4px; border:0; border-radius:18px; display:grid; place-items:center; background:var(--accent); color:var(--accent-fg); box-shadow:0 4px 0 var(--accent-deep); font-size:clamp(1.1rem,4.4vw,2rem); font-weight:600; font-variant-numeric:tabular-nums; text-align:center; overflow:hidden}
.mcard[data-state="up"]{background:var(--surface); color:var(--fg); box-shadow:0 4px 0 var(--edge)}
.mcard[data-state="done"]{background:var(--accent-soft); color:var(--accent-soft-fg); box-shadow:none; outline:4px solid var(--accent); outline-offset:-4px}
.mcard svg{display:block; width:100%; height:100%}
.mcard .back{font-size:clamp(1.6rem,6vw,2.6rem); opacity:.85}
.banner{background:var(--surface); border-radius:20px; box-shadow:0 3px 0 var(--edge); padding:14px 18px; font-size:clamp(1.4rem,6vw,2.4rem); font-weight:600; text-align:center; font-variant-numeric:tabular-nums}
.mtab{display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); gap:3px; width:100%; max-width:760px; margin:0 auto}
.mh{display:grid; place-items:center; font-weight:600; color:var(--accent); font-size:clamp(.8rem,3vw,1.3rem)}
.mc{border:0; padding:clamp(5px,1.6vw,12px) 0; border-radius:8px; background:var(--surface); box-shadow:0 2px 0 var(--edge); font-weight:600; font-size:clamp(.72rem,2.7vw,1.2rem); font-variant-numeric:tabular-nums}
.mc.in{background:var(--accent-soft); color:var(--accent-soft-fg)}
.mc.on{background:var(--action); color:var(--action-fg); box-shadow:0 2px 0 var(--action-deep)}

/* Note, garderoba, pregled za starše */
.stl{stroke:var(--fg); stroke-width:1.4; fill:none; stroke-linecap:round}
.nhead{fill:var(--fg)}
.staff{width:min(100%,520px)}
.staff svg{display:block; width:100%; height:auto}
.wardrobe{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr)); gap:12px}
.ward{display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 10px; border:0; border-radius:22px; background:var(--surface); box-shadow:0 4px 0 var(--edge); text-align:center}
.ward .mascot{width:96px; height:96px}
.ward .t{font-weight:600; font-size:1.05rem}
.ward .d{color:var(--muted); font-size:.95rem}
.ward.locked{opacity:.65}
.ward[aria-pressed="true"]{outline:4px solid var(--accent); outline-offset:-4px}
.prow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface); border-radius:16px; padding:10px 14px; box-shadow:0 3px 0 var(--edge)}
.prow .nm{flex:1 1 180px; font-weight:600}
.prow .nm small{display:block; font-weight:400; color:var(--muted)}
.prow .bar2{flex:0 1 140px; width:140px; height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden}
.prow .bar2 i{display:block; height:100%; background:var(--accent)}
.prow.weak .bar2 i{background:var(--action)}
.prow .val{min-width:4.2em; text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.plist{display:grid; gap:8px}

/* Rezultat */
.result{display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; margin:auto 0; background:var(--surface); border-radius:28px; box-shadow:0 5px 0 var(--edge); padding:clamp(24px,5vh,48px) 20px}
.result .mascot{width:120px; height:120px}
.score{font-size:clamp(3.5rem,16vw,6rem); font-weight:600; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums}
.starrow{display:flex; flex-wrap:wrap; justify-content:center; gap:6px}
.starrow .s{display:grid}
.starrow svg{width:clamp(22px,7vw,36px); height:clamp(22px,7vw,36px)}
.starrow .s:not(.on) .pb{fill:none; stroke:var(--muted)}
.starrow .s:not(.on) .ps{display:none}
.actions{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:8px}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.pop{animation:pop .45s ease}
.shake{animation:shake .35s ease}
.fb[data-state="ok"] .mascot,.result .mascot{animation:hop .6s ease}
.fb[data-state="retry"] .mascot,.fb[data-state="wrong"] .mascot{animation:wobble .5s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');

  /* ---------- Shranjevanje (samo na tej napravi) ---------- */
  var KEY = 'matematicno-igrisce-v1';

  save.streak = Number(save.streak) || 0;

  save.hat = String(save.hat || '');

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  function dayKey(d) {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function currentStreak() {
    var now = new Date(), y = new Date();
    y.setDate(y.getDate() - 1);
    return (save.lastDay === dayKey(now) || save.lastDay === dayKey(y)) ? save.streak : 0;
  }
  function recordPlay() {
    var now = new Date(), y = new Date();
    y.setDate(y.getDate() - 1);
    var today = dayKey(now);
    if (save.lastDay === today) return;
    save.streak = (save.lastDay === dayKey(y)) ? save.streak + 1 : 1;

  }

  /* ---------- Pomožne funkcije ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};

      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      if (Array.isArray(kid)) { for (var j = 0; j < kid.length; j++) el.append(kid[j]); continue; }

    }

  }

  function dni(n) { var m = n % 100; if (m === 1) return 'dan'; if (m === 2) return 'dneva'; return 'dni'; }

  var teardown = null;
  function setView(nodes, td) {
    if (teardown) { teardown(); teardown = null; }
    app.replaceChildren.apply(app, nodes);
    teardown = td || null;
    window.scrollTo(0, 0);
  }

  /* ---------- Ikone ---------- */
  function svg(cls, body) { return '<svg class="' + cls + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + body + '</svg>'; }
  var ICON = {
    pearl: '<svg class="pearl" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="pb" cx="12" cy="12" r="9"/><ellipse class="ps" cx="8.8" cy="8.6" rx="2.8" ry="1.6" transform="rotate(-35 8.8 8.6)"/></svg>',

  };
  var BIG = {
    plusminus: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M14 21h14M21 14v14"/><path class="b" d="M28 41h14"/></svg>',

    clock: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><circle class="a" cx="28" cy="28" r="15"/><path class="a" d="M28 19v9l6 4"/></svg>',
    divide: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M14 28h28"/><path class="b" d="M28 15v.01M28 41v.01"/></svg>',

    coin: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><circle class="a" cx="28" cy="28" r="16"/><path class="b" d="M33 22a8 8 0 100 12M21 26h11M21 31h11"/></svg>',
    book: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M10 15h14a4 4 0 014 4v23a4 4 0 00-4-4H10zM46 15H32a4 4 0 00-4 4v23a4 4 0 014-4h14z"/></svg>',
    ruler: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M8 22h40v13H8z"/><path class="b" d="M16 22v6M24 22v8M32 22v6M40 22v8"/></svg>',
    calendar: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M11 15h34v29H11zM11 25h34"/><path class="b" d="M20 10v7M36 10v7"/></svg>',
    pie: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><circle class="a" cx="28" cy="28" r="16"/><path class="b" d="M28 28V12M28 28l12 12"/></svg>',

    bolt: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M31 9L16 32h11l-2 15 15-24H29z"/></svg>',
    grid: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path class="a" d="M12 12h32v32H12zM12 23h32M12 34h32"/><path class="b" d="M23 12v32M34 12v32"/></svg>',

    timer: '<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><circle class="a" cx="28" cy="31" r="15"/><path class="b" d="M28 31V22M23 10h10"/></svg>'
  };

  /* ---------- Ura s kazalci ---------- */
  function clockSVG(hr, mn) {
    var s = '<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle class="cface" cx="100" cy="100" r="94"/>';
    for (var t = 0; t < 60; t++) {
      var a = t * 6 * Math.PI / 180, big = t % 5 === 0, r1 = big ? 80 : 85, r2 = 90;

        '" x2="' + (100 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (100 - r2 * Math.cos(a)).toFixed(1) + '"/>';
    }
    for (var n = 1; n <= 12; n++) {
      var b = n * 30 * Math.PI / 180;
      s += '<text class="cnum" x="' + (100 + 64 * Math.sin(b)).toFixed(1) + '" y="' + (100 - 64 * Math.cos(b) + 8).toFixed(1) + '" text-anchor="middle" font-size="22">' + n + '</text>';

    s += '<line class="chour" x1="100" y1="100" x2="100" y2="58" transform="rotate(' + ha + ' 100 100)"/>';
    s += '<line class="cmin" x1="100" y1="100" x2="100" y2="34" transform="rotate(' + ma + ' 100 100)"/>';

  }

  /* ---------- Maskota Hobi (izvirna hobotnica) ---------- */
  var EYES_OPEN =
    '<circle class="oe" cx="40" cy="52" r="10"/><circle class="oe" cx="80" cy="52" r="10"/>' +
    '<circle class="op" cx="42" cy="54" r="5"/><circle class="op" cx="82" cy="54" r="5"/>' +
    '<circle class="oh" cx="44" cy="52" r="1.8"/><circle class="oh" cx="84" cy="52" r="1.8"/>';
  // mood: 'happy' | 'cheer' | 'oops'
  function octopus(mood, hat) {
    var eyes = EYES_OPEN, mouth, brows = '';
    if (mood === 'cheer') {
      eyes = '<path class="oa" d="M31 54q9-11 18 0M71 54q9-11 18 0"/>';
      mouth = '<path class="om" d="M49 63q11 20 22 0z"/>';

      brows = '<path class="oa" d="M30 38l17 6M90 38l-17 6"/>';
      mouth = '<path class="oa" d="M52 71q8-8 16 0"/>';
    } else {
      mouth = '<path class="oa" d="M50 64q10 10 20 0"/>';
    }
    return '<svg class="mascot" viewBox="0 0 120 120" aria-hidden="true" focusable="false">' +
      '<path class="ot" d="M30 70c-7 14 3 22-7 36"/><path class="ot" d="M48 74c-3 16 6 22-1 34"/>' +
      '<path class="ot" d="M72 74c3 16-6 22 1 34"/><path class="ot" d="M90 70c7 14-3 22 7 36"/>' +
      '<path class="ob" d="M60 8C88 8 102 30 102 52c0 14-6 22-12 28H30c-6-6-12-14-12-28C18 30 32 8 60 8z"/>' +
      '<circle class="od" cx="46" cy="24" r="4"/><circle class="od" cx="74" cy="20" r="3"/><circle class="od" cx="62" cy="34" r="2.5"/>' +
      '<ellipse class="oc" cx="29" cy="66" rx="6" ry="4"/><ellipse class="oc" cx="91" cy="66" rx="6" ry="4"/>' +
      eyes + brows + mouth + (HATS[hat == null ? save.hat : hat] || '') + '</svg>';
  }

  /* ---------- Zvok ---------- */
  var ac = null;
  function beep(kind) {
    if (!save.sound) return;

      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var seqs = {
        ok: [[660, 0], [880, 0.12]],
        wrong: [[240, 0]],
        done: [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]]

      (seqs[kind] || []).forEach(function (n) {

        g.gain.exponentialRampToValueAtTime(0.15, t + n[1] + 0.02);

        osc.start(t + n[1]); osc.stop(t + n[1] + 0.26);

  }

  /* ---------- Računi (generator) ---------- */
  /*GEN-START*/
  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  // level: 'easy' = brez prehoda čez desetico, 'hard' = s prehodom, 'mixed' = oboje
  function makeQuestion(level) {
    var want = level === 'mixed' ? (Math.random() < 0.5 ? 'easy' : 'hard') : level;
    for (var n = 0; n < 1000; n++) {
      var a, b, carry;
      if (Math.random() < 0.5) {
        a = rnd(11, 89); b = rnd(2, 89);
        if (a + b > 100) continue;
        carry = (a % 10) + (b % 10) >= 10;
        if (want === 'easy' && carry) continue;
        if (want === 'hard' && !carry) continue;
        if (a % 10 === 0 && b % 10 === 0 && Math.random() < 0.85) continue;
        return { a: a, b: b, op: '+', ans: a + b };
      } else {
        a = rnd(21, 99); b = rnd(2, a - 1);
        carry = (a % 10) < (b % 10);
        if (want === 'easy' && carry) continue;
        if (want === 'hard' && !carry) continue;
        if (a % 10 === 0 && b % 10 === 0 && Math.random() < 0.85) continue;
        return { a: a, b: b, op: '-', ans: a - b };
      }
    }
    return { a: 43, b: 25, op: '+', ans: 68 };
  }

  function makeRound(level, n) {
    var seen = {}, out = [], guard = 0;
    while (out.length < n && guard++ < 2000) {
      var q = makeQuestion(level), key = q.a + q.op + q.b;
      if (seen[key]) continue;
      seen[key] = true; out.push(q);
    }
    return out;
  }
  // Poštevanka: vsaj ena številka je iz izbranih poštevank, druga je od 2 do 10, vrstni red je naključen
  function makeMulRound(tables, n) {
    var seen = {}, out = [], guard = 0;
    while (out.length < n && guard++ < 3000) {
      var t = tables[rnd(0, tables.length - 1)], m = rnd(2, 10);
      var swap = Math.random() < 0.5;
      var a = swap ? m : t, b = swap ? t : m;
      var key = a + '*' + b;
      if (seen[key]) continue;
      seen[key] = true;
      out.push({ a: a, b: b, op: '*', ans: a * b });
    }
    return out;
  }
  // Deljenje brez ostanka iz poštevank: zmnožek delimo z enim od obeh faktorjev
  function makeDivRound(tables, n) {
    var seen = {}, out = [], guard = 0;
    while (out.length < n && guard++ < 3000) {
      var t = tables[rnd(0, tables.length - 1)], m = rnd(2, 10);
      var p = t * m, d = Math.random() < 0.5 ? t : m;
      var key = p + '/' + d;
      if (seen[key]) continue;
      seen[key] = true;
      out.push({ a: p, b: d, op: '/', ans: p / d });
    }
    return out;
  }
  // Branje ure: vsako vprašanje ima 4 možnosti, ena je pravilna.
  // mode 'read': ura s kazalci, izbereš čas. mode 'set': dan je čas, izbereš uro s kazalci.
  var CLOCK_MIN = { ure: [0], pol: [0, 15, 30, 45], pet: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55] };
  function fmtTime(h, m) { return h + ':' + (m < 10 ? '0' : '') + m; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function makeClockQuestion(level, mode) {
    var mins = CLOCK_MIN[level];
    var h = rnd(1, 12), m = mins[rnd(0, mins.length - 1)];
    var cand = [], seen = {};
    seen[h + ':' + m] = true;
    function add(hh, mm) {
      if (hh < 1) hh += 12;
      if (hh > 12) hh -= 12;
      if (mins.indexOf(mm) < 0) return;
      var k = hh + ':' + mm;
      if (seen[k]) return;
      seen[k] = true;
      cand.push({ h: hh, m: mm });
    }
    add(m === 0 ? 12 : m / 5, (h * 5) % 60);   // pogosta zmota: zamenjana kazalca
    add(h + 1, m); add(h - 1, m); add(h + 2, m);
    mins.forEach(function (mm) { add(h, mm); });
    var guard = 0;
    while (cand.length < 3 && guard++ < 200) add(rnd(1, 12), mins[rnd(0, mins.length - 1)]);
    var options = shuffle(cand).slice(0, 3);
    options.push({ h: h, m: m });
    shuffle(options);
    var correct = 0;
    options.forEach(function (o, idx) { if (o.h === h && o.m === m) correct = idx; });
    return { mode: mode, h: h, m: m, options: options, correct: correct };
  }

  function makeClockRound(level, n) {
    var seen = {}, out = [], guard = 0;
    while (out.length < n && guard++ < 3000) {
      var q = makeClockQuestion(level, Math.random() < 0.5 ? 'read' : 'set'), key = q.mode + q.h + ':' + q.m;
      if (seen[key]) continue;
      seen[key] = true; out.push(q);
    }
    return out;
  }
  // Zaporedja števil: 5 členov, en (ne prvi) manjka
  function arith(start, step, len) { var t = []; for (var i = 0; i < len; i++) t.push(start + step * i); return t; }

  // level: 'easy' = enak korak naprej, 'mid' = naprej ali nazaj z večjimi koraki,
  // 'hard' = podvajanje, izmenična koraka ali koraki, ki rastejo za 1
  function makeSeqQuestion(level) {
    var len = 5, terms, i;
    if (level === 'easy') {
      var s1 = [1, 2, 3, 5, 10][rnd(0, 4)];
      terms = arith(rnd(0, Math.min(30, 100 - s1 * (len - 1))), s1, len);
    } else if (level === 'mid') {
      var s2 = rnd(2, 9), down = Math.random() < 0.5;
      terms = down ? arith(rnd(s2 * (len - 1), 100), -s2, len) : arith(rnd(0, 100 - s2 * (len - 1)), s2, len);
    } else {
      var kind = rnd(0, 2);
      if (kind === 0) {              // podvajanje
        terms = [rnd(1, 5)];
        for (i = 1; i < len; i++) terms.push(terms[i - 1] * 2);
      } else if (kind === 1) {       // izmenična koraka
        var a = rnd(1, 5), b = rnd(1, 5);
        while (b === a) b = rnd(1, 5);
        terms = [rnd(0, 30)];
        for (i = 1; i < len; i++) terms.push(terms[i - 1] + (i % 2 === 1 ? a : b));
      } else {                       // koraki, ki rastejo za 1
        var d = rnd(1, 3);
        terms = [rnd(0, 20)];
        for (i = 1; i < len; i++) terms.push(terms[i - 1] + d + i - 1);
      }
    }
    var idx = rnd(1, len - 1), seq = terms.slice(), ans = seq[idx];
    seq[idx] = null;
    return { seq: seq, ans: ans };
  }

  function makeSeqRound(level, n) {
    var seen = {}, out = [], guard = 0;
    while (out.length < n && guard++ < 3000) {
      var q = makeSeqQuestion(level), key = q.seq.join(',') + ':' + q.ans;
      if (seen[key]) continue;
      seen[key] = true; out.push(q);
    }
    return out;
  }

  // Logična zaporedja likov (0 krog, 1 trikotnik, 2 kvadrat, 3 romb): vzorec se ponavlja, izbereš naslednji lik
  var SHAPE_PATTERNS = { easy: ['AB', 'AAB', 'ABB'], hard: ['ABC', 'AABB', 'ABAC', 'AABC'] };
  function makeShapeQuestion(level) {
    var pats = SHAPE_PATTERNS[level], p = pats[rnd(0, pats.length - 1)];
    var kinds = shuffle([0, 1, 2, 3]);
    var unit = p.split('').map(function (c) { return kinds[c.charCodeAt(0) - 65]; });

  function startChoiceGame(cfg) {
    var qs = cfg.round();
    if (window.__MATH_TEST__) window.__MATH_TEST__.qs = qs;
    var total = qs.length;
    var i = 0, tries = 0, locked = false, firstTry = 0, opts = [], curView = null;

    var ref = {};
    ref.count = h('span', { class: 'count' });
    ref.earnedIcon = h('span', { class: 'ei', html: ICON.pearl });
    ref.earnedNum = h('b', null, '0');
    ref.fill = h('i');
    ref.stage = h('div', { class: 'qcard clockcard' });
    ref.fbIcon = h('span', { class: 'mi' });
    ref.fbText = h('span', { class: 'ft' });
    ref.fb = h('div', { class: 'fb', 'data-state': 'idle', role: 'status', 'aria-live': 'polite' }, ref.fbIcon, ref.fbText);
    ref.opts = h('section', { class: 'opts' });
    ref.next = h('button', { class: 'key go next', type: 'button', hidden: true, onclick: function () { next(); } }, 'Naprej');

    function setFb(state, text) {
      ref.fb.setAttribute('data-state', state);
      ref.fbIcon.innerHTML = octopus(MOODS[state]);
      ref.fbText.textContent = text;
    }
    function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

    function renderQ() {
      var q = qs[i];
      tries = 0; locked = false;
      ref.count.textContent = 'Vprašanje ' + (i + 1) + ' od ' + total;
      ref.fill.style.width = (i / total * 100) + '%';
      ref.next.hidden = true;
      curView = (cfg.view || clockView)(q);
      ref.stage.replaceChildren(curView.stage);
      opts = curView.options.map(function (o, idx) {
        return h('button', {
          class: 'opt' + curView.optClass, type: 'button',
          'aria-label': o.label || null,
          html: o.html || null,
          onclick: function () { choose(idx); }
        }, o.text || null);
      });
      ref.opts.className = 'opts' + curView.optsClass;
      ref.opts.replaceChildren.apply(ref.opts, opts.concat([ref.next]));
      setFb('idle', curView.idle);
    }
    function lockRound() {
      locked = true;
      ref.fill.style.width = ((i + 1) / total * 100) + '%';
      opts.forEach(function (b) { b.disabled = true; });
      ref.next.textContent = i === total - 1 ? 'Končaj' : 'Naprej';
      ref.next.hidden = false;
      try { ref.next.focus({ preventScroll: true }); } catch (e) {}
    }
    function choose(idx) {
      if (locked || opts[idx].disabled) return;
      var q = qs[i];
      if (idx === q.correct) {
        if (tries === 0) { firstTry++; ref.earnedNum.textContent = String(firstTry); retrigger(ref.earnedIcon, 'pop'); }
        opts[idx].setAttribute('data-state', 'right');
        setFb('ok', PRAISE[rnd(0, PRAISE.length - 1)]);
        beep('ok');
        lockRound();
      } else if (tries === 0) {
        tries = 1;
        opts[idx].setAttribute('data-state', 'wrong');
        opts[idx].disabled = true;
        setFb('retry', 'Skoraj! Poskusi še enkrat.');
        beep('wrong');
      } else {
        opts[idx].setAttribute('data-state', 'wrong');
        opts[q.correct].setAttribute('data-state', 'right');
        setFb('wrong', curView.reveal + ' Naslednjič ti bo uspelo!');
        beep('wrong');
        lockRound();
      }
    }
    function next() {
      if (i >= total - 1) { finish(); return; }
      i++; renderQ();
    }
    function finish() {
      save.stars += firstTry;
      recordPlay();
      if (save.best[cfg.key] == null || firstTry > save.best[cfg.key]) save.best[cfg.key] = firstTry;
      persist();
      beep('done');
      viewResult(cfg, firstTry, total);
    }

    function onKey(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (/^[1-4]$/.test(e.key)) choose(Number(e.key) - 1);
      else if (e.key === 'Enter') {
        if (e.target && e.target.closest && e.target.closest('button')) return;
        if (locked) next();
      }
    }
    document.addEventListener('keydown', onKey);

    var earned = h('span', { class: 'earned', 'aria-label': 'Biseri v tem krogu' }, ref.earnedIcon, ref.earnedNum);
    var backBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Nazaj na izbiro', title: 'Nazaj', html: ICON.back, onclick: function () { cfg.back(); } });

    setView([
      h('header', { class: 'bar' }, backBtn, ref.count, earned),
      h('div', { class: 'progress', role: 'presentation' }, ref.fill),
      h('div', { class: 'play' },
        h('section', { class: 'stage' }, ref.stage, ref.fb),
        ref.opts)
    ], function () { document.removeEventListener('keydown', onKey); });

    renderQ();
  }

  function startMemory(cfg) {
    var cards = makeMemoryCards(cfg.level), moves = 0, open = [], found = 0, timer = null, busy = false, btns;
    if (window.__MATH_TEST__) window.__MATH_TEST__.cards = cards;
    var count = h('span', { class: 'count' }, 'Poteze: 0');
    function face(c) {
      return c.clock ? clockSVG(c.clock[0], c.clock[1]) : null;
    }
    function render(idx, state) {
      var b = btns[idx], c = cards[idx];
      b.setAttribute('data-state', state);
      if (state === 'down') { b.innerHTML = '<span class="back">?</span>'; b.setAttribute('aria-label', 'Skrita karta'); }
      else if (c.clock) { b.innerHTML = face(c); b.setAttribute('aria-label', 'Ura ' + fmtTime(c.clock[0], c.clock[1]).replace(':', ' in ')); }
      else { b.textContent = c.t; b.setAttribute('aria-label', c.t); }
    }
    function finish() {
      var pearls = Math.max(1, Math.min(10, 20 - moves));
      save.stars += pearls;
      recordPlay();
      if (save.best[cfg.key] == null || pearls > save.best[cfg.key]) save.best[cfg.key] = pearls;
      persist();
      beep('done');
      var rc = {};
      for (var k in cfg) rc[k] = cfg[k];
      rc.sub = 'biserov za ' + moves + ' ' + (moves === 1 ? 'potezo' : moves === 2 ? 'potezi' : (moves === 3 || moves === 4) ? 'poteze' : 'potez');
      viewResult(rc, pearls, 10);
    }
    function flip(idx) {
      if (busy || btns[idx].getAttribute('data-state') !== 'down') return;
      render(idx, 'up'); open.push(idx);
      if (open.length < 2) return;
      moves++; count.textContent = 'Poteze: ' + moves;
      var a = open[0], b = open[1];
      open = [];
      if (cards[a].pair === cards[b].pair) {
        render(a, 'done'); render(b, 'done'); found++; beep('ok');
        if (found === cards.length / 2) { busy = true; timer = setTimeout(finish, 700); }
      } else {
        busy = true; beep('wrong');
        timer = setTimeout(function () { render(a, 'down'); render(b, 'down'); busy = false; }, 900);
      }
    }
    btns = cards.map(function (c, idx) {
      return h('button', { class: 'mcard', type: 'button', onclick: function () { flip(idx); } });
    });
    btns.forEach(function (_, idx) { render(idx, 'down'); });
    setView([
      h('header', { class: 'bar' },
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Nazaj na izbiro', title: 'Nazaj', html: ICON.back, onclick: function () { cfg.back(); } }),
        count, h('span', { style: 'min-width:52px' })),
      h('div', { class: 'mem' }, btns)
    ], function () { if (timer) clearTimeout(timer); });
  }

    function sp(key, kind) { return function (back) { return { key: key, round: function () { return makeSpeedRound(kind); }, seconds: 60, back: back, backLabel: 'Druga igra' }; }; }
    viewMenu('Hitro računanje', 'Reši čim več nalog v 60 sekundah. Za vsaki dve rešeni nalogi dobiš biser, največ 10.', [{ items: [
      { key: 'speed-plus', name: 'Seštevanje in odštevanje', desc: 'Števila do 100', ex: '60 sekund', cfg: sp('speed-plus', 'plus') },
      { key: 'speed-mul', name: 'Poštevanka', desc: 'Množenje in deljenje', ex: '60 sekund', cfg: sp('speed-mul', 'mul') },
      { key: 'speed-all', name: 'Vse skupaj', desc: 'Vse štiri računske operacije', ex: '60 sekund', cfg: sp('speed-all', 'all') }
    ] }]);
  }

  /* ---------- Hobijeva garderoba ---------- */
  var HATS = {
    kapitan: '<path d="M30 22C30 4 90 4 90 22z" fill="#1B2A4A"/><rect x="26" y="20" width="68" height="9" rx="4.5" fill="#fff" stroke="#1B2A4A" stroke-width="2"/><circle cx="60" cy="13" r="4" fill="#E9A400"/>',
    masna: '<path d="M56 14L36 3v22zM64 14l20-11v22z" fill="#FF6FA0" stroke="#D94B82" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="14" r="5.5" fill="#D94B82"/>',
    ocala: '<rect x="22" y="43" width="32" height="21" rx="9" fill="#1B2540"/><rect x="66" y="43" width="32" height="21" rx="9" fill="#1B2540"/><path d="M54 51h12" stroke="#1B2540" stroke-width="3.5"/><path d="M28 48l8-2M72 48l8-2" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>',
    krona: '<path d="M33 22l5-17 11 10 11-14 11 14 11-10 5 17z" fill="#E9A400" stroke="#8A5A00" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="14" r="3" fill="#C93B2B"/>',
    carovnik: '<path d="M60 0L33 26h54z" fill="#7B5EA7" stroke="#3F2A70" stroke-width="2.5" stroke-linejoin="round"/><rect x="26" y="23" width="68" height="7" rx="3.5" fill="#5B3FA0" stroke="#3F2A70" stroke-width="2"/><circle cx="58" cy="14" r="2.2" fill="#FFE27A"/><circle cx="65" cy="20" r="1.6" fill="#FFE27A"/>'
  };
  var HAT_LIST = [
    { id: 'kapitan', name: 'Kapitanska kapa', need: 15 },
    { id: 'masna', name: 'Roza mašna', need: 40 },
    { id: 'ocala', name: 'Sončna očala', need: 80 },
    { id: 'krona', name: 'Zlata krona', need: 150 },
    { id: 'carovnik', name: 'Čarovnikov klobuk', need: 250 }
  ];
  function newHatNote(gained) {
    var prev = save.stars - gained, got = HAT_LIST.filter(function (x) { return x.need > prev && x.need <= save.stars; });
    return got.length ? h('p', { class: 'sub', style: 'font-weight:600; color:var(--accent)' }, 'Odklenil si nov dodatek za Hobija: ' + got.map(function (x) { return x.name; }).join(', ') + '!') : null;
  }
  function viewWardrobe() {
    var items = [{ id: '', name: 'Brez dodatka', need: 0 }].concat(HAT_LIST);
    setView([
      h('header', { class: 'pagehead' },
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Nazaj na začetek', title: 'Nazaj', html: ICON.back, onclick: function () { viewHome(); } }),
        h('h1', null, 'Hobijeva garderoba')),
      h('p', { class: 'sub' }, 'Z biseri odkleneš nove dodatke. Zdaj imaš ' + save.stars + ' ' + biserov(save.stars) + '.'),
      h('section', { class: 'wardrobe' }, items.map(function (it) {
        var unlocked = save.stars >= it.need;
        return h('button', {
          class: 'ward' + (unlocked ? '' : ' locked'), type: 'button', disabled: !unlocked, 'data-hat': it.id, 'aria-pressed': String(save.hat === it.id),
          onclick: function () { save.hat = it.id; persist(); viewWardrobe(); }
        },
          h('span', { html: octopus('happy', it.id), style: 'display:grid' }),
          h('span', { class: 't' }, it.name),
          h('span', { class: 'd' }, unlocked ? (save.hat === it.id ? 'Nosi ga' : 'Obleci') : 'Še ' + kol(it.need - save.stars, NOUN.biser)));
      }))
    ]);
  }

  /* ---------- Pregled za starše ---------- */
  var PARENT_GROUPS = [
    { label: 'Seštevanje in odštevanje', match: function (k) { return k === 'easy' || k === 'hard' || k === 'mixed'; } },
    { label: 'Množenje', match: function (k) { return k.indexOf('mul') === 0; } },
    { label: 'Deljenje', match: function (k) { return k.indexOf('div') === 0; } },
    { label: 'Števila (desetice, primerjanje, manjkajoče)', match: function (k) { return /^(ten|cmp|miss)-/.test(k); } },
    { label: 'Besedilne naloge', match: function (k) { return k.indexOf('word-') === 0; } },
    { label: 'Denar', match: function (k) { return k.indexOf('money-') === 0; } },
    { label: 'Branje ure', match: function (k) { return k.indexOf('clock-') === 0; } },
    { label: 'Koledar', match: function (k) { return k.indexOf('cal-') === 0; } },
    { label: 'Merjenje', match: function (k) { return k.indexOf('meas-') === 0; } },
    { label: 'Liki', match: function (k) { return k.indexOf('poly-') === 0; } },
    { label: 'Ulomki', match: function (k) { return /^(frac|fo)-/.test(k); } },
    { label: 'Zaporedja', match: function (k) { return k.indexOf('seq-') === 0; } },
    { label: 'Črkovanje', match: function (k) { return k.indexOf('let-') === 0; } },
    { label: 'Branje not', match: function (k) { return k.indexOf('note-') === 0; } },
    { label: 'Spomin', match: function (k) { return k.indexOf('mem-') === 0; } },
    { label: 'Hitro računanje', match: function (k) { return k.indexOf('speed-') === 0; } },
    { label: 'Mešani izziv', match: function (k) { return k === 'izziv'; } }
  ];
  function viewParents() {
    var armed = false, streak = currentStreak();
    var resetBtn = h('button', { class: 'btn ghost', type: 'button', onclick: function () {
      if (!armed) { armed = true; resetBtn.textContent = 'Res izbrišem? Tapni še enkrat.'; return; }
      save.stars = 0; save.streak = 0; save.lastDay = ''; save.best = {}; save.hat = '';
      persist(); viewHome();
    } }, 'Izbriši ves napredek');
    var rows = PARENT_GROUPS.map(function (g) {
      var keys = Object.keys(save.best).filter(g.match), sum = 0, i;
      for (i = 0; i < keys.length; i++) sum += save.best[keys[i]];
      var avg = keys.length ? sum / keys.length : 0, weak = keys.length > 0 && avg < 7;
      return h('div', { class: 'prow' + (weak ? ' weak' : '') },
        h('span', { class: 'nm' }, g.label, h('small', null, keys.length ? 'Preizkušenih stopenj: ' + keys.length + (weak ? ' · vredno še vaditi' : '') : 'Še ni igrano')),
        h('span', { class: 'bar2', role: 'img', 'aria-label': keys.length ? 'Povprečni najboljši rezultat ' + avg.toFixed(1) + ' od 10' : 'Ni podatkov' }, h('i', { style: 'width:' + (avg * 10) + '%' })),
        h('span', { class: 'val' }, keys.length ? avg.toFixed(1).replace('.', ',') + ' / 10' : '–'));
    });
    setView([
      h('header', { class: 'pagehead' },
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Nazaj na začetek', title: 'Nazaj', html: ICON.back, onclick: function () { viewHome(); } }),
        h('h1', null, 'Pregled za starše')),
      h('p', { class: 'sub' }, 'Skupaj ' + save.stars + ' ' + biserov(save.stars) + ', zaporedni dnevi igranja: ' + streak + '. Prikazan je povprečni najboljši rezultat po temah (od 10). Podatki so shranjeni samo na tej napravi.'),
      h('section', { class: 'plist' }, rows),
      h('div', { class: 'actions' }, resetBtn)
    ]);
  }

  var PRAISE = ['Odlično!', 'Bravo!', 'Super, plavaš v računih!', 'Točno! Hobi je navdušen!', 'Tako se računa!'];
  var MOODS = { idle: 'happy', ok: 'cheer', retry: 'oops', wrong: 'oops' };

  function startGame(cfg) {
    if (cfg.kind === 'clock' || cfg.kind === 'choice') { startChoiceGame(cfg); return; }
    if (cfg.kind === 'memory') { startMemory(cfg); return; }
    var qs = cfg.round();
    if (window.__MATH_TEST__) window.__MATH_TEST__.qs = qs;
    var total = qs.length;
    var i = 0, input = '', tries = 0, locked = false, firstTry = 0, solved = 0, timerId = null, ended = false;

    var ref = {};
    ref.count = h('span', { class: 'count' });
    ref.earnedIcon = h('span', { class: 'ei', html: ICON.pearl });
    ref.earnedNum = h('b', null, '0');
    ref.fill = h('i');
    ref.expr = h('div', { class: 'expr' });
    ref.extra = h('div', { class: 'coins', hidden: true });
    ref.ans = h('div', { class: 'ans empty', 'aria-live': 'polite' });
    ref.fbIcon = h('span', { class: 'mi' });
    ref.fbText = h('span', { class: 'ft' });
    ref.fb = h('div', { class: 'fb', 'data-state': 'idle', role: 'status', 'aria-live': 'polite' }, ref.fbIcon, ref.fbText);

    function setFb(state, text) {
      ref.fb.setAttribute('data-state', state);
      ref.fbIcon.innerHTML = octopus(MOODS[state]);
      ref.fbText.textContent = text;
    }
    function setGo(label) { ref.go.textContent = label; }
    function retrigger(el, cls) {
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    }
    function showAns() {
      ref.ans.textContent = input || '?';
      ref.ans.classList.toggle('empty', !input);
    }
    function renderQ() {
      var q = qs[i];
      input = ''; tries = 0; locked = false;
      if (!cfg.seconds) {
        ref.count.textContent = 'Vprašanje ' + (i + 1) + ' od ' + total;
        ref.fill.style.width = (i / total * 100) + '%';
      }
      ref.extra.replaceChildren.apply(ref.extra, (q.coins || []).map(coinNode));
      ref.extra.hidden = !q.coins;
      if (q.seq) {
        ref.expr.className = 'expr seq';
        ref.expr.replaceChildren.apply(ref.expr, q.seq.map(function (v) {
          return h('span', { class: 'tile' + (v == null ? ' gap' : '') }, v == null ? '?' : String(v));
        }));
        ref.expr.setAttribute('aria-label', 'Zaporedje: ' + q.seq.map(function (v) { return v == null ? 'manjka' : v; }).join(', '));
      } else if (q.prompt) {
        ref.expr.className = 'expr ' + (q.eq ? 'eq' : 'word');
        ref.expr.textContent = q.prompt;
        ref.expr.setAttribute('aria-label', q.prompt);
      } else {
        var sym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[q.op];
        var word = { '+': ' plus ', '-': ' minus ', '*': ' krat ', '/': ' deljeno z ' }[q.op];
        ref.expr.className = 'expr';
        ref.expr.textContent = q.a + ' ' + sym + ' ' + q.b;
        ref.expr.setAttribute('aria-label', q.a + word + q.b);
      }
      ref.ans.classList.remove('reveal');
      showAns();
      setFb('idle', q.seq ? 'Vpiši manjkajoče število in pritisni Preveri.' : q.prompt ? 'Vpiši odgovor in pritisni Preveri.' : 'Vpiši rezultat in pritisni Preveri.');
      setGo('Preveri');
    }
    function press(d) {
      if (locked) return;
      if (input === '0') input = '';
      if (input.length < 3) input += d;
      showAns();
    }
    function erase() {
      if (locked) return;
      input = input.slice(0, -1);
      showAns();
    }
    function lockRound() {
      locked = true;
      ref.fill.style.width = ((i + 1) / total * 100) + '%';
      setGo(i === total - 1 ? 'Končaj' : 'Naprej');
    }
    function check() {
      if (locked) { next(); return; }
      if (!input) { setFb('idle', 'Najprej vpiši rezultat.'); return; }
      var q = qs[i];
      if (cfg.seconds) {
        if (Number(input) === q.ans) {
          solved++;
          ref.earnedNum.textContent = String(Math.min(10, Math.ceil(solved / 2))); retrigger(ref.earnedIcon, 'pop');
          beep('ok');
          if (i >= total - 1) { finish(); return; }
          i++; renderQ();
        } else {
          beep('wrong'); retrigger(ref.ans, 'shake'); input = ''; showAns();
          setFb('retry', 'Skoraj! Poskusi še enkrat.');
        }
        return;
      }
      if (Number(input) === q.ans) {
        if (tries === 0) { firstTry++; ref.earnedNum.textContent = String(firstTry); retrigger(ref.earnedIcon, 'pop'); }
        setFb('ok', PRAISE[rnd(0, PRAISE.length - 1)]);
        beep('ok');
        lockRound();
      } else if (tries === 0) {
        tries = 1;
        setFb('retry', 'Skoraj! Poskusi še enkrat.');
        beep('wrong');
        retrigger(ref.ans, 'shake');
        input = ''; showAns();
      } else {
        setFb('wrong', 'Pravilen odgovor je ' + q.ans + '. Naslednjič ti bo uspelo!');
        beep('wrong');
        ref.ans.textContent = String(q.ans);
        ref.ans.classList.remove('empty');
        ref.ans.classList.add('reveal');
        lockRound();
      }
    }
    function next() {
      if (i >= total - 1) { finish(); return; }
      i++; renderQ();
    }
    function finishTimed() {
      var pearls = Math.min(10, Math.ceil(solved / 2));
      save.stars += pearls;
      recordPlay();
      if (save.best[cfg.key] == null || pearls > save.best[cfg.key]) save.best[cfg.key] = pearls;
      persist();
      beep('done');
      var rc = {};
      for (var k in cfg) rc[k] = cfg[k];
      rc.sub = 'biserov. Rešenih nalog: ' + solved;
      viewResult(rc, pearls, 10);
    }
    function finish() {
      if (ended) return;
      ended = true;
      if (cfg.seconds) { finishTimed(); return; }
      save.stars += firstTry;
      recordPlay();
      if (save.best[cfg.key] == null || firstTry > save.best[cfg.key]) save.best[cfg.key] = firstTry;
      persist();
      beep('done');
      viewResult(cfg, firstTry, total);
    }

    function key(label, fn, extra, props) {
      var p = { type: 'button', class: 'key' + (extra ? ' ' + extra : ''), onmousedown: function (e) { e.preventDefault(); }, onclick: fn };
      for (var k in (props || {})) p[k] = props[k];
      return h('button', p, label);
    }
    var keys = '123456789'.split('').map(function (d) { return key(d, function () { press(d); }); });
    keys.push(key(null, erase, '', { html: ICON.del, 'aria-label': 'Briši' }));
    keys.push(key('0', function () { press('0'); }));
    ref.go = key('Preveri', check, 'go');
    keys.push(ref.go);

    var earned = h('span', { class: 'earned', 'aria-label': 'Biseri v tem krogu' }, ref.earnedIcon, ref.earnedNum);
    var backBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Nazaj na izbiro', title: 'Nazaj', html: ICON.back, onclick: function () { cfg.back(); } });

    function onKey(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') erase();
      else if (e.key === 'Enter') {
        if (e.target && e.target.closest && e.target.closest('button')) return;
        check();
      }
    }
    document.addEventListener('keydown', onKey);

    setView([
      h('header', { class: 'bar' }, backBtn, ref.count, earned),
      h('div', { class: 'progress', role: 'presentation' }, ref.fill),
      h('div', { class: 'play' },
        h('section', { class: 'stage' }, h('div', { class: 'qcard' }, ref.expr, ref.extra, ref.ans), ref.fb),
        h('section', { class: 'pad' }, keys))
    ], function () { document.removeEventListener('keydown', onKey); if (timerId) clearInterval(timerId); });

    if (cfg.seconds) {
      var secs = (window.__MATH_TEST__ && window.__MATH_TEST__.seconds) || cfg.seconds, t0 = Date.now();
      ref.count.textContent = 'Še ' + secs + ' s';
      timerId = setInterval(function () {
        var left = Math.max(0, secs - Math.floor((Date.now() - t0) / 1000));
        ref.count.textContent = 'Še ' + left + ' s';
        ref.fill.style.width = ((secs - left) / secs * 100) + '%';
        if (left <= 0) finish();
      }, 250);
    }
    renderQ();
  }

  function viewResult(cfg, score, total) {
    var msg = score >= 9 ? 'Čudovit rezultat!' : score >= 7 ? 'Odlično!' : score >= 5 ? 'Dobro gre. Vaja dela mojstra!' : 'Trud se splača. Poskusi še enkrat!';
    var row = h('div', { class: 'starrow', role: 'img', 'aria-label': score + ' od ' + total + ' biserov' });
    for (var k = 0; k < total; k++) row.append(h('span', { class: 's' + (k < score ? ' on' : ''), html: ICON.pearl }));
    setView([
      h('div', { class: 'result' },
        h('span', { html: octopus(score >= 5 ? 'cheer' : 'happy'), style: 'display:grid' }),
        h('h1', null, msg),
        h('div', { class: 'score' }, score + ' od ' + total),
        h('p', { class: 'sub' }, cfg.sub || 'pravilnih na prvi poskus'),
        row,
        h('p', null, 'Skupaj imaš ' + kol(save.stars, NOUN.biser) + '.'),
        newHatNote(score),
        h('div', { class: 'actions' },
          h('button', { class: 'btn', type: 'button', onclick: function () { startGame(cfg); } }, 'Še enkrat'),
          h('button', { class: 'btn ghost', type: 'button', onclick: function () { cfg.back(); } }, cfg.backLabel),
          h('button', { class: 'btn ghost', type: 'button', onclick: function () { viewHome(); } }, 'Domov')))
    ]);
  }

  viewHome();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
